<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LectureAI — Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f9;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif}
nav{height:64px;background:rgba(251,251,253,.9);backdrop-filter:blur(20px);border-bottom:1px solid #e8e8ed}
.navin{max-width:1100px;width:calc(100% - 32px);height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700}.actions{display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:999px;padding:9px 15px;font-weight:650;cursor:pointer}
.outline{background:white;border:1px solid #d2d2d7}.dark{background:#1d1d1f;color:#fff}
.wrap{max-width:1100px;width:calc(100% - 32px);margin:auto;padding:55px 0}
h1{font-size:52px;letter-spacing:-2.5px;margin:5px 0}.muted{color:#6e6e73}
.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:18px;margin-top:30px}
.card{background:#fff;border:1px solid #e7e7eb;border-radius:24px;padding:24px;box-shadow:0 12px 35px rgba(0,0,0,.04)}
.plan{display:flex;justify-content:space-between;align-items:flex-start}.price{font-size:32px;font-weight:700;margin:8px 0 14px}
.row{display:flex;justify-content:space-between;gap:15px;padding:16px 0;border-top:1px solid #eee}.row small{display:block;color:#86868b;margin-top:4px}
.pill{background:#f2f2f7;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:650}
.bar{height:8px;background:#e5e5ea;border-radius:99px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:#0071e3}
.notice{margin-top:14px;padding:14px;border-radius:14px;background:#f5f5f7;font-size:13px;line-height:1.5}
@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:42px}}
</style>
</head>
<body>
<nav><div class="navin">
  <div class="brand">✦ LectureAI</div>
  <div class="actions">
    <span id="userEmail" class="muted"></span>
    <button id="logout" class="btn outline">Log out</button>
  </div>
</div></nav>

<main class="wrap">
  <div class="muted">Your learning space</div>
  <h1>Welcome back.</h1>
  <p id="welcome" class="muted">Loading your account…</p>

  <div class="grid">
    <section>
      <div class="card">
        <div class="plan">
          <div>
            <div class="muted">Current plan</div>
            <div id="planName" class="price">Free</div>
          </div>
          <span class="pill">Active</span>
        </div>
        <div class="muted">Monthly lecture usage</div>
        <div class="bar" style="margin-top:10px"><i id="usageBar"></i></div>
        <p id="usageText" class="muted">0 / 60 minutes</p>
      </div>

      <div class="card" style="margin-top:18px">
        <h2>My Lectures</h2>
        <div id="lectures"><p class="muted">No lectures saved yet.</p></div>
      </div>
    </section>

    <aside>
      <div class="card">
        <h2>Account</h2>
        <div class="row"><div><b>Email</b><small id="accountEmail"></small></div></div>
        <div class="row"><div><b>Plan</b><small id="accountPlan">Free</small></div></div>
        <div class="notice">Your account is ready. Next we can add Beta invitation codes, Lecture History, and paid plans.</div>
      </div>
    </aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script>
const client = window.supabase.createClient(
  window.LECTUREAI_SUPABASE_URL,
  window.LECTUREAI_SUPABASE_KEY,
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
);

async function boot() {
  const { data: { session } } = await client.auth.getSession();
  if (!session) { window.location.href = "/"; return; }

  const email = session.user.email || "";
  document.getElementById("userEmail").textContent = email;
  document.getElementById("accountEmail").textContent = email;

  const { data: profile } = await client
    .from("profiles")
    .select("display_name, plan")
    .eq("id", session.user.id)
    .maybeSingle();

  const plan = profile?.plan || "free";
  const displayName = profile?.display_name || email.split("@")[0];

  document.getElementById("welcome").textContent = `Hi ${displayName}. Your LectureAI account is ready.`;
  document.getElementById("planName").textContent = plan[0].toUpperCase() + plan.slice(1);
  document.getElementById("accountPlan").textContent = plan[0].toUpperCase() + plan.slice(1);

  // Usage is prepared for the next phase.
  document.getElementById("usageText").textContent = "0 / 60 minutes";
  document.getElementById("usageBar").style.width = "0%";

  const { data: lectures } = await client
    .from("lectures")
    .select("title, course, created_at")
    .order("created_at", { ascending: false })
    .limit(10);

  if (lectures?.length) {
    document.getElementById("lectures").innerHTML = lectures.map(x =>
      `<div class="row"><div><b>${escapeHtml(x.title)}</b><small>${escapeHtml(x.course || "General")} · ${new Date(x.created_at).toLocaleDateString()}</small></div><span class="pill">Saved</span></div>`
    ).join("");
  }
}

function escapeHtml(value) {
  return String(value || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

document.getElementById("logout").onclick = async () => {
  await client.auth.signOut();
  window.location.href = "/";
};

boot();
</script>
</body>
</html>
