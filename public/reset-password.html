<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LectureAI — Reset password</title>

<style>
body{
  margin:0;
  background:#f5f5f7;
  color:#1d1d1f;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif
}

.wrap{
  max-width:430px;
  margin:12vh auto;
  padding:32px
}

.card{
  background:#fff;
  border:1px solid #e5e5ea;
  border-radius:24px;
  padding:30px;
  box-shadow:0 18px 50px rgba(0,0,0,.07)
}

h1{
  margin:0 0 8px;
  font-size:32px;
  letter-spacing:-1px
}

p{
  color:#6e6e73;
  line-height:1.5
}

input{
  width:100%;
  box-sizing:border-box;
  padding:13px 14px;
  margin:8px 0;
  border:1px solid #d2d2d7;
  border-radius:12px;
  font-size:16px
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:999px;
  background:#0071e3;
  color:white;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  margin-top:10px
}

#msg{
  font-size:13px;
  margin-top:14px;
  min-height:20px
}

a{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#0071e3;
  text-decoration:none
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>Set a new password</h1>

    <p>
      Choose a new password for your LectureAI account.
    </p>

    <input
      id="password"
      type="password"
      minlength="6"
      placeholder="New password"
    >

    <input
      id="confirm"
      type="password"
      minlength="6"
      placeholder="Confirm password"
    >

    <button id="save">
      Update password
    </button>

    <div id="msg"></div>

    <a href="/">
      Back to LectureAI
    </a>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/supabase-config.js"></script>

<script>

const client = window.supabase.createClient(
  window.LECTUREAI_SUPABASE_URL,
  window.LECTUREAI_SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const msg = document.getElementById("msg");

document.getElementById("save").onclick = async () => {

  const p = document.getElementById("password").value;
  const c = document.getElementById("confirm").value;

  if(p.length < 6){
    msg.textContent = "Password must be at least 6 characters.";
    return;
  }

  if(p !== c){
    msg.textContent = "Passwords do not match.";
    return;
  }

  const { error } = await client.auth.updateUser({
    password:p
  });

  if(error){
    msg.textContent = error.message;
    return;
  }

  msg.style.color = "#18794e";

  msg.textContent = "Password updated. Redirecting…";

  setTimeout(() => {
    location.href = "/dashboard.html";
  },900);

};

</script>

</body>
</html>
